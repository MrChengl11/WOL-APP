name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      working-directory: ./WakeOnLan-Android
      # 增加参数忽略 Kotlin 重复类冲突，并强制编译
      run: gradle assembleDebug -Pandroid.dependencyResolutionManagement.ignoreDependencies -Dorg.gradle.jvmargs="-Xmx2048m" --warning-mode none

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wake-on-lan-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
